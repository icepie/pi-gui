name: Dev Release

on:
  push:
    branches:
      - main
      - pi-fit
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare Dev Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete previous dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes
          fi

      - name: Move dev tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev

      - name: Create draft dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev \
            --title "Dev Release" \
            --notes "Automated dev build for ${GITHUB_SHA}." \
            --draft \
            --prerelease \
            --latest=false \
            --verify-tag \
            --target "$GITHUB_SHA"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            runner: macos-latest
            script: package:mac:x64
            output: darwin-x64
          - name: macOS arm64
            runner: macos-latest
            script: package:mac:arm64
            output: darwin-arm64
          - name: Windows x64
            runner: windows-latest
            script: package:win:x64
            output: win32-x64
          - name: Windows arm64
            runner: windows-latest
            script: package:win:arm64
            output: win32-arm64
            needsZig: true
          - name: Linux x64
            runner: ubuntu-latest
            script: package:linux:x64
            output: linux-x64
          - name: Linux arm64
            runner: ubuntu-latest
            script: package:linux:arm64
            output: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Zig for Windows arm64 cross-packaging
        if: ${{ matrix.needsZig }}
        shell: pwsh
        run: |
          choco install zig --no-progress -y
          zig version

      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PI_APP_UNSIGNED_PACKAGE: "1"
        run: pnpm --filter @pi-gui/desktop run ${{ matrix.script }}

      - name: Upload package assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find "apps/desktop/release/${{ matrix.output }}" -maxdepth 1 -type f ! -name "latest*.yml" | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No dev release assets found in apps/desktop/release/${{ matrix.output }}." >&2
            exit 1
          fi

          gh release upload dev "${files[@]}" --clobber

  publish:
    name: Publish Dev Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit dev \
            --title "Dev Release" \
            --notes "Automated dev build for ${GITHUB_SHA}." \
            --prerelease \
            --latest=false \
            --draft=false \
            --target "$GITHUB_SHA"
