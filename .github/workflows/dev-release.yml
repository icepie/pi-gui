name: Dev Release

on:
  push:
    branches:
      - main
      - pi-fit
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            script: package:mac:arm64
            output: darwin-arm64
            artifact: dev-release-macos-arm64
          - name: Windows x64
            runner: windows-latest
            script: package:win:x64
            output: win32-x64
            artifact: dev-release-windows-x64
          - name: Linux x64
            runner: ubuntu-latest
            script: package:linux:x64
            output: linux-x64
            artifact: dev-release-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PI_APP_UNSIGNED_PACKAGE: "1"
        run: pnpm --filter @pi-gui/desktop run ${{ matrix.script }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/release/${{ matrix.output }}/*.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Dev Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/dev-release
          merge-multiple: true

      - name: Delete previous dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes
          fi

      - name: Move dev tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find dist/dev-release -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No dev release artifacts found." >&2
            exit 1
          fi

          gh release create dev "${files[@]}" \
            --title "Dev Release" \
            --notes "Automated dev build for ${GITHUB_SHA}." \
            --prerelease \
            --latest=false \
            --verify-tag \
            --target "$GITHUB_SHA"
