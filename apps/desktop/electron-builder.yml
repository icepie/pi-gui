appId: cn.fid.fit.pi-fit
productName: 飞度小派
copyright: Copyright 2026 Matthew Lam
electronVersion: 42.4.0
generateUpdatesFilesForAllChannels: false

publish:
  provider: github
  owner: icepie
  repo: pi-gui
  tagNamePrefix: "v"
  releaseType: release

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  - "!**/.DS_Store"
  - "!**/*.log"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/*.tsbuildinfo"
  - "!**/{test,tests,__tests__,coverage,docs,examples,benchmark,benchmarks}/**/*"
  - "!**/*.{test,spec}.{js,cjs,mjs,ts,cts,mts,jsx,tsx}"
  - "!**/{README,README.md,README.txt,CHANGELOG,CHANGELOG.md,HISTORY,HISTORY.md,AUTHORS,AUTHORS.md,CONTRIBUTORS,CONTRIBUTORS.md,CONTRIBUTING,CONTRIBUTING.md}"

extraResources:
  - from: resources/icon.png
    to: icon.png

afterPack: ./scripts/after-pack.cjs

asar: true
npmRebuild: false
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: pi-fit-${version}-${arch}.${ext}

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - dmg
    - zip
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

linux:
  icon: resources/icon.png
  category: Development
  executableName: pi-fit
  maintainer: Matthew Lam <icepie.dev@gmail.com>
  target:
    - target: AppImage
    - target: deb
    - target: rpm

deb:
  packageName: pi-fit

rpm:
  packageName: pi-fit

win:
  icon: resources/icon.ico
  target:
    - nsis
  executableName: pi-fit
  artifactName: pi-fit-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: pi-fit-${version}-${arch}-setup.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
